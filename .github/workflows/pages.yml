# Hosted demo deploy (Run 3, Phase 23).
#
# The build job (export, build, unit tests, Playwright, Lighthouse) runs on
# pull requests AND on push to main, so a PR exercises the real Linux browser
# gates before merge; the deploy job runs only on push to main. The Python
# suite runs in ci.yml; this workflow gates the site itself.
#
# Visual snapshot baselines are platform-specific and committed from the
# development machine, so the Playwright step here sets SKIP_SNAPSHOTS=1
# (documented in web/e2e/quality.spec.ts); every other gate runs in full.
#
# Requires GitHub Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings -> Pages).

name: Deploy demo site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per ref so PR runs never cancel a main deploy (or each other).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Export demo bundle (fixed-seed generated world)
        run: uv run margin-engine export-web --demo --out web/public/data
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type generation is in sync with the schema
        working-directory: web
        run: |
          npm run gen-types
          git diff --exit-code src/types/bundle.ts
      - name: Build
        working-directory: web
        run: npm run build
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: End-to-end, axe and interaction gates
        working-directory: web
        env:
          SKIP_SNAPSHOTS: "1"
        run: npx playwright test
      - name: Upload Playwright debug artifacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Lighthouse gates (performance 90, accessibility 95, best practices 95)
        working-directory: web
        run: |
          npx --yes serve@14.2.4 -l 5050 dist &
          sleep 3
          node lighthouse.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
