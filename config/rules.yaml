# Margin Engine policy configuration.
# Every value here is a business-policy or model choice; algorithms live in code.
# All sections validate against pydantic models in src/margin_engine/config.py —
# unknown keys and out-of-range values fail at load time.

schema:
  version: 1

mapping:
  mapping_file: config/mappings/synth_erp.yaml
  fail_on_missing_semantics: true

units_and_currency:
  reporting_currency: USD
  currency_decimals: 2
  fx_rate_policy: invoice_date

transactions:
  dedupe_on: source_key
  flag_lookalike_duplicates: true
  price_credit_reasons: [price_correction, customer_rebate]
  cost_credit_reasons: [damage, shortage, quality, warranty]

hierarchy:
  analysis_level: ship_to

returns:
  reason_policies:
    customer_error: {restocking_fee_pct: "0.15", return_freight_paid_by: customer}
    distributor_error: {restocking_fee_pct: "0", return_freight_paid_by: distributor}
    defective: {restocking_fee_pct: "0", return_freight_paid_by: distributor}
  default_handling_cost_per_return_cents: 1500
  default_handling_cost_per_unit_cents: 50
  default_return_freight_per_return_cents: 1200

costing:
  missing_cost_policy: exclude_from_cost_metrics
  zero_cost_policy: flag_for_review
  vendor_rebate_treatment: adjust_acquisition_cost

cost_to_serve:
  per_order_cents: 1800
  per_line_cents: 150
  per_delivery_cents: 900
  special_handling_per_unit_cents: 0
  min_order_value_cents: 50000
  max_orders_per_month: 6.0

waterfall:
  allocation_basis_priority: [actual, weight, cube, handling_units, lines, extended_price]
  rounding: half_even
  allocation_method: largest_remainder

outliers:
  method: modified_robust_zscore
  zscore_threshold: 3.5
  min_peer_group_size: 30
  mad_zero_fallback_pct: 0.10

segmentation:
  commercial_tree:
    max_depth: 5
    min_leaf_lines: 500
    min_leaf_lines_pct: 0.005
    min_leaf_customers: 20
    min_leaf_items: 10
  margin_driver_tree:
    max_depth: 4
    min_leaf_lines: 500
    min_leaf_lines_pct: 0.005
    min_leaf_customers: 20
    min_leaf_items: 10
  bootstrap_resamples: 30
  abc_a_share: 0.80
  abc_b_share: 0.15

price_guidance:
  band_percentiles: [0.25, 0.50, 0.75]
  observation_unit: customer_item_month_median
  # Minimum pocket GROSS margin: (pocket revenue - product cost) / pocket revenue.
  min_pocket_gross_margin: "0.05"
  # Optional minimum CONTRIBUTION margin (subtracts cost-to-serve too). Unset
  # by default; when set, guidance reports both floors and which one binds.
  # min_contribution_margin: "0.02"
  min_band_observations: 10
  provisional_target_percentile: 0.50
  provisional_start_percentile: 0.75
  floor_rounding: ceiling

sensitivity:
  panel_period: month
  active_assortment_lookback_months: 6
  min_first_stage_f: 10.0
  robustness_max_spread: 0.20
  max_ci_width: 1.0
  overid_alpha: 0.05
  # Two-way clustering (month AND customer, Cameron-Gelbach-Miller): demand
  # shocks correlate across the items a customer buys in one month AND, when
  # demand is persistent, across months within a customer. Chosen by the
  # persistent-demand coverage study (Run 4, 24.5; recorded in
  # docs/validation.json): under AR(1) customer demand, month-only clustering
  # covers ~78% and supplier x month ~77%, while month x customer stays within
  # the 90-98% target - and on the iid well-identified world it matches
  # month-only coverage exactly, so nothing is given up.
  cluster_level: month_customer
  # Where the supplier cost instrument comes from (Run 4, 27.6):
  #   reference_table  a mapped supplier_cost_index table (default)
  #   receipts         built from purchase/receipt history (mix-corrected
  #                    within-supplier log cost deviations)
  #   external         a public series (e.g. BLS PPI) mapped to categories via
  #                    external_index_map, then to suppliers by modal category
  instrument_source: reference_table
  # Validation without planted truth (Run 4, 27.4): temporal backtest, placebo
  # tests and rolling-window stability in the report. Informational only.
  real_data_validation: true
  backtest_holdout_months: 6
  placebo_draws: 10
  stability_window_months: 12
  stability_step_months: 6
  instruments:
    - name: supplier_cost_shock
      column: supplier_cost_shock
      varies_at: "supplier_id:month"
      exclusion_rationale: >
        Supplier-specific input cost shocks shift the prices a distributor pays
        and therefore the prices it charges, but individual customers' demand
        for an item does not depend on the supplier's upstream costs except
        through the price they are charged. Valid unless customers observe and
        react to supplier conditions directly (e.g. anticipated shortages).
    - name: category_tariff_shock
      column: category_tariff_shock
      varies_at: "item_category:month"
      exclusion_rationale: >
        Tariff changes on an import category move landed cost for all items in
        the category. Customer-level demand shocks do not cause tariff policy,
        and tariffs affect purchase quantity only through the realized price.
        Valid unless demand and tariff policy share a driver (e.g. a boom in a
        sector that also triggers protection).

opportunity:
  baseline_window_months: 12
  exclude_contract_protected: true
  exclude_insufficient_data: true

tariff_scenarios:
  pass_through_levels: [0.0, 0.5, 1.0]
  exclude_contract_protected: true
  cost_pool: new_receipts

reporting:
  output_formats: [parquet, csv, html]
  show_evidence_status: true
  show_data_coverage: true
  # Books tie-out (Run 4, 27.3), used when a gl_totals table is mapped: a
  # month-measure fails when the engine-vs-GL difference exceeds BOTH bounds
  # (the cents floor keeps tiny months from failing on rounding pennies).
  tieout_tolerance_pct: 0.5
  tieout_tolerance_cents: 100
