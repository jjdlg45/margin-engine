# Planned backend-for-frontend (BFF) contract for the Margin Engine demo UI.
#
# The static site implements this exact contract today with a local adapter
# that reads the exported JSON files (web/src/lib/api/staticAdapter.ts);
# a live deployment swaps that one file for an HTTP adapter against these
# endpoints. The BFF owns caching, rate limiting, pagination and any
# server-side computation - the browser never recalculates financials.

openapi: 3.1.0
info:
  title: Margin Engine BFF
  version: 1.0.0
  description: >
    One aggregated endpoint per page plus paginated table endpoints.
    Every figure originates from the engine's exports; money is integer cents.

paths:
  /app:
    get:
      summary: App-level data loaded once per session
      description: Label dictionary, headline KPIs, honest-label notices, versions.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppData" }

  /pages/{page}:
    get:
      summary: Aggregated payload for one page
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
            enum:
              [overview, waterfall, customers, segments, guidance,
               sensitivity, opportunity, scenarios, methodology, modules]
      responses:
        "200":
          description: >
            The page's aggregates and facet lists. Shapes are the exported
            page files (web/public/data/{page}.json); the authoritative field
            shapes live in the bundle schema (web/public/data/schema.json).
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }

  /tables/{table}:
    get:
      summary: Paginated, filterable, sortable table rows
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: string, enum: [guidance, opportunities, customers] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - name: sort
          in: query
          description: "field or -field for descending"
          schema: { type: string }
        - name: filters
          in: query
          description: >
            URL-encoded JSON object of named filters. Supported keys per
            table - guidance: customer, item, statuses[], segments[],
            pol_min/pol_max (current price, % of list), gap_min/gap_max
            (points vs floor); opportunities: customer, item, evidence[],
            treatments[], gross_min/gross_max (dollars), below_min/below_max
            (percent); customers: customer, flags[], losing (bool),
            returns_min/returns_max (dollars), excluded_min/excluded_max
            (percent), orders_min/orders_max.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TablePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tables/guidance/explanations/{customer_id}/{item_id}:
    get:
      summary: Plain-English explanation for one guidance pair
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: string } }
        - { name: item_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [explanation]
                properties:
                  explanation: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Action center (Run 5, Phase 39) --------------------------------------
  # Identity: every mutating request carries X-User, a CONFIGURED user name
  # (api settings users spec). This is local identity, NOT authentication;
  # real login belongs to a future hosting phase. Roles: analyst (proposes,
  # edits, submits, exports, marks implemented), approver (approves/rejects),
  # viewer (reads only). All endpoints are rate-limited like the rest.

  /actions:
    get:
      summary: Paginated, filterable action queue (with derived status)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - name: sort
          in: query
          schema: { type: string }
        - name: filters
          in: query
          description: >
            URL-encoded JSON object. Keys - types[], statuses[], priorities[],
            evidence[], owner, customer, item, compliance (bool: only flagged),
            impact_min/impact_max (dollars).
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TablePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Manually propose an action (analyst)
      description: >
        Price-type proposals are guardrail-checked against the binding floor on
        record for the pair; a pair with no floor on record is refused (422).
      parameters: [{ $ref: "#/components/parameters/XUser" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeAction" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [action_id, status]
                properties:
                  action_id: { type: string }
                  status: { type: string }
        "403": { $ref: "#/components/responses/PolicyError" }
        "422": { $ref: "#/components/responses/PolicyError" }

  /actions/summary:
    get:
      summary: Open-actions summary (counts by status, impact by evidence)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionsSummary" }

  /actions/{action_id}:
    get:
      summary: One action with its full event history and edit audit
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit an action (analyst; pre-approval statuses only)
      description: >
        Editable fields: owner, due_date, title, rationale,
        proposed_price_cents (never below the binding floor). Every edit is
        recorded in the append-only edit audit.
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [action_id, changed_fields]
                properties:
                  action_id: { type: string }
                  changed_fields: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }
        "422": { $ref: "#/components/responses/PolicyError" }

  /actions/{action_id}/submit:
    post:
      summary: Submit for review (analyst; proposed -> under review)
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TransitionResult" }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }

  /actions/{action_id}/approve:
    post:
      summary: Approve (approver; never the proposer/submitter)
      description: >
        A written justification (reason) is REQUIRED when the action carries a
        compliance flag. Approving an already-approved action returns
        changed=false (idempotent).
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TransitionResult" }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }
        "422": { $ref: "#/components/responses/PolicyError" }

  /actions/{action_id}/reject:
    post:
      summary: Reject (approver)
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TransitionResult" }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }

  /actions/{action_id}/rework:
    post:
      summary: Rework a rejected action (analyst; rejected -> proposed)
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TransitionResult" }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }

  /actions/{action_id}/implement:
    post:
      summary: Mark implemented (analyst; exported -> implemented)
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/XUser" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TransitionResult" }
        "403": { $ref: "#/components/responses/PolicyError" }
        "409": { $ref: "#/components/responses/PolicyError" }

  /actions/price-export:
    post:
      summary: Build the ERP-ready price file from approved price actions
      description: >
        Returns the diff summary (count, expected impact BY BASIS - never
        summed across opportunity levels, largest changes) and the CSV text in
        the configured template. dry_run previews without changing state;
        otherwise every still-approved price action moves to exported (logged).
        Re-exporting is idempotent - the identical file, no repeated events.
      parameters: [{ $ref: "#/components/parameters/XUser" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { dry_run: { type: boolean, default: false } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [summary, csv, n_transitioned, dry_run]
                properties:
                  summary: { type: object }
                  csv: { type: string }
                  n_transitioned: { type: integer }
                  dry_run: { type: boolean }
        "403": { $ref: "#/components/responses/PolicyError" }

  /actions/bulk-approve:
    post:
      summary: Bulk approve with per-item guardrail checks
      description: >
        Items that fail a check are REFUSED with the reason (their status is
        untouched - refusing to approve is not a human rejection); items
        already approved report outcome "unchanged".
      parameters: [{ $ref: "#/components/parameters/XUser" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action_ids]
              properties:
                action_ids: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkApproveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /load/upload:
    post:
      summary: Upload a CSV/.xlsx invoice-line export (raw body)
      description: >
        Load-your-own-data flow (API/local mode only - the static demo has no
        API). The file bytes are the request body; the original filename is a
        query parameter. 200 MB cap; .csv and .xlsx only.
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, filename, n_bytes]
                properties:
                  upload_id: { type: string }
                  filename: { type: string }
                  n_bytes: { type: integer }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /load/profile/{upload_id}:
    post:
      summary: Profile the upload and list every confirmable mapping value
      description: >
        Runs the Phase 27 profiler; the response carries per-column guesses
        (candidate canonical fields with confidence and reason) and
        "confirmables": one entry per guessed mapping value, each with its
        current guess, the kind of answer it takes (column / choice / text)
        and the choices. txn_column repoints the transaction-code column to
        another detected candidate and re-derives the code list.
      parameters:
        - { name: upload_id, in: path, required: true, schema: { type: string } }
        - { name: txn_column, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadProfile" }
        "404": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /load/mapping/{upload_id}:
    post:
      summary: Save the mapping after every guess is human-confirmed
      description: >
        values maps each confirmable's value_path to its confirmed value.
        Refused while any confirmable is missing (named in the message), for
        any path that is not confirmable, and when the engine's own mapping
        loader rejects the result - its actionable message is returned
        verbatim. Suggestions never become silent decisions.
      parameters:
        - { name: upload_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: { type: string } }
                txn_column: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, ok]
                properties:
                  upload_id: { type: string }
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /load/run/{upload_id}:
    post:
      summary: Run the pipeline on the confirmed upload (background)
      description: >
        Starts the full engine run in a background thread; when it finishes
        the served bundle switches to the results and new actions merge into
        the review queue. One run at a time; 409 while another is in
        progress or when no confirmed mapping exists.
      parameters:
        - { name: upload_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, state]
                properties:
                  upload_id: { type: string }
                  state: { type: string }
        "404": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /load/status/{upload_id}:
    get:
      summary: Background run state (idle / running / done / failed)
      parameters:
        - { name: upload_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [state, message]
                properties:
                  state: { type: string, enum: [idle, running, done, failed] }
                  message: { type: string }

components:
  parameters:
    XUser:
      name: X-User
      in: header
      required: true
      description: Configured user name (local identity, NOT authentication).
      schema: { type: string }
  schemas:
    LoadProfile:
      type: object
      required: [upload_id, filename, n_rows, columns, txn_candidates, confirmables]
      properties:
        upload_id: { type: string }
        filename: { type: string }
        n_rows: { type: integer }
        n_blank_rows: { type: integer }
        encoding: { type: string }
        delimiter: { type: string }
        decimal_separator: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, dtype_guess, null_rate, n_distinct, candidates]
            properties:
              name: { type: string }
              dtype_guess: { type: string }
              null_rate: { type: number }
              n_distinct: { type: integer }
              date_formats: { type: array, items: { type: string } }
              candidates:
                type: array
                items:
                  type: object
                  required: [canonical, confidence, reason]
                  properties:
                    canonical: { type: string }
                    confidence: { type: number }
                    reason: { type: string }
        txn_candidates: { type: array, items: { type: string } }
        confirmables:
          type: array
          items:
            type: object
            required: [path, value_path, current, kind, choices, note]
            properties:
              path: { type: string }
              value_path: { type: string }
              current: { type: string }
              kind: { type: string, enum: [column, choice, text] }
              choices: { type: array, items: { type: string } }
              note: { type: string }
    AppData:
      type: object
      required: [bundle_version, engine_version, data_label, honest_labels, labels, kpis]
      properties:
        bundle_version: { type: string }
        engine_version: { type: string }
        # Traceability (Run 6, Phase 84): the run behind every served number.
        rules_sha256: { type: string }
        mapping_sha256: { type: string }
        input_fingerprint: { type: string }
        config_fingerprint: { type: string }
        model_fingerprint: { type: string }
        data_label: { type: string }
        honest_labels: { type: array, items: { type: string } }
        labels:
          type: object
          additionalProperties:
            type: object
            required: [label, description]
            properties:
              label: { type: string }
              description: { type: string }
        kpis: { type: object }
    TablePage:
      type: object
      required: [items, total, total_unfiltered, page, page_size, has_more]
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer, description: Rows matching the filters }
        total_unfiltered: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    ActionsSummary:
      type: object
      required: [n_actions, by_status, impact_by_evidence_cents, n_blocked, n_compliance_flagged]
      properties:
        n_actions: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        impact_by_evidence_cents:
          type: object
          additionalProperties: { type: integer }
        n_blocked: { type: integer }
        n_compliance_flagged: { type: integer }
    ActionDetail:
      type: object
      required: [action, status, events, edits]
      properties:
        action: { type: object }
        status: { type: string }
        events:
          type: array
          items:
            type: object
            required: [action_id, seq, who, at, to_status]
            properties:
              action_id: { type: string }
              seq: { type: integer }
              who: { type: string }
              at: { type: string }
              from_status: { type: [string, "null"] }
              to_status: { type: string }
              note: { type: string }
        edits: { type: array, items: { type: object } }
    ProposeAction:
      type: object
      required: [action_type, title, rationale]
      properties:
        action_type:
          type: string
          enum: [price_change, below_floor_fix, cost_pass_through, service_policy, rebate_discount_review]
        title: { type: string }
        rationale: { type: string }
        customer_id: { type: string }
        item_id: { type: string }
        proposed_price_cents: { type: integer }
        expected_impact_cents: { type: integer }
        priority: { type: string, enum: [high, medium, low] }
        owner: { type: string }
    BulkApproveResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [action_id, outcome, reason]
            properties:
              action_id: { type: string }
              outcome: { type: string, enum: [approved, unchanged, refused] }
              reason: { type: string }
  responses:
    NotFound:
      description: Unknown page, table or pair
      content:
        application/json:
          schema:
            type: object
            properties: { detail: { type: string } }
    BadRequest:
      description: Malformed pagination, sort or filter parameters
      content:
        application/json:
          schema:
            type: object
            properties: { detail: { type: string } }
    TransitionResult:
      description: The transition happened (changed) or was already in effect
      content:
        application/json:
          schema:
            type: object
            required: [action_id, status, changed]
            properties:
              action_id: { type: string }
              status: { type: string }
              changed: { type: boolean }
    PolicyError:
      description: >
        A review-policy or lifecycle refusal; code names the rule
        (role_denied, self_approval, justification_required, blocked,
        below_floor, floor_unknown, status_not_editable, invalid_transition).
      content:
        application/json:
          schema:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
