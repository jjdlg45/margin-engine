[project]
name = "margin-engine"
version = "0.1.0"
description = "Auditable pricing and margin decision engine for B2B distributors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.17",
    "duckdb>=1.1",
    "pandera[polars]>=0.21",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "pyfixest>=0.25",
    "linearmodels>=6.1",
    "statsmodels>=0.14",
    "typer>=0.15",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pyarrow>=18.0",
]

[project.scripts]
margin-engine = "margin_engine.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "synth"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "N",                # naming
]
ignore = [
    "E501",  # line length handled by formatter
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "margin_engine.*"
strict = true

[[tool.mypy.overrides]]
module = [
    "pandera.*",
    "sklearn.*",
    "pyfixest.*",
    "linearmodels.*",
    "statsmodels.*",
    "scipy.*",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/margin_engine"]
