name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src api
      - name: Tests
        run: uv run pytest --cov --cov-report=term
      # Excluded from the default run because they need more RAM than the
      # 14 GB build machine can spare beside a desktop - not because they are
      # allowed to fail. The runner has 16 GB, so they run here on every push.
      - name: Memory-heavy tests
        timeout-minutes: 30
        run: uv run pytest -m memory_heavy --no-cov
      # Supply-chain audits (Run 5, Phase 44). pip-audit checks the exact
      # locked set; npm audit fails on high or critical. docs/security.md
      # documents how to handle a finding.
      - name: Audit Python dependencies (pip-audit)
        run: |
          uv export --frozen --all-groups --format requirements-txt             --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip
      - name: Audit npm dependencies (high and critical fail)
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
