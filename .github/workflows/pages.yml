# Hosted demo deploy (Run 3, Phase 23).
#
# On push to main: run the engine's web export on the fixed-seed demo world,
# build the static app, run the web quality gates (vitest, Playwright, axe,
# Lighthouse), and deploy web/dist to GitHub Pages. The Python suite runs in
# ci.yml; this workflow gates the site itself.
#
# Visual snapshot baselines are platform-specific and committed from the
# development machine, so the Playwright step here sets SKIP_SNAPSHOTS=1
# (documented in web/e2e/quality.spec.ts); every other gate runs in full.
#
# Requires GitHub Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings -> Pages).

name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Export demo bundle (fixed-seed generated world)
        run: uv run margin-engine export-web --demo --out web/public/data
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type generation is in sync with the schema
        working-directory: web
        run: |
          npm run gen-types
          git diff --exit-code src/types/bundle.ts
      - name: Build
        working-directory: web
        run: npm run build
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: End-to-end, axe and interaction gates
        working-directory: web
        env:
          SKIP_SNAPSHOTS: "1"
        run: npx playwright test
      - name: Lighthouse gates (performance 90, accessibility 95, best practices 95)
        working-directory: web
        run: |
          npx --yes serve@14.2.4 -l 5050 dist &
          sleep 3
          node lighthouse.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
