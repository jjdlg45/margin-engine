# Supply-chain updates (Run 5, Phase 44): dependency PRs for every ecosystem
# this repo ships. CI gates every PR (lint, types, tests, pip-audit,
# npm audit --audit-level=high); docs/security.md says how to handle findings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
