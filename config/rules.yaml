# Margin Engine policy configuration.
# Every value here is a business-policy or model choice; algorithms live in code.
# All sections validate against pydantic models in src/margin_engine/config.py —
# unknown keys and out-of-range values fail at load time.

schema:
  version: 1

mapping:
  mapping_file: config/mappings/synth_erp.yaml
  fail_on_missing_semantics: true

units_and_currency:
  reporting_currency: USD
  currency_decimals: 2
  fx_rate_policy: invoice_date

transactions:
  dedupe_on: source_key
  flag_lookalike_duplicates: true
  price_credit_reasons: [price_correction, customer_rebate]
  cost_credit_reasons: [damage, shortage, quality, warranty]

hierarchy:
  analysis_level: ship_to

returns:
  reason_policies:
    customer_error: {restocking_fee_pct: "0.15", return_freight_paid_by: customer}
    distributor_error: {restocking_fee_pct: "0", return_freight_paid_by: distributor}
    defective: {restocking_fee_pct: "0", return_freight_paid_by: distributor}
  default_handling_cost_per_return_cents: 1500
  default_handling_cost_per_unit_cents: 50
  default_return_freight_per_return_cents: 1200

costing:
  missing_cost_policy: exclude_from_cost_metrics
  zero_cost_policy: flag_for_review
  vendor_rebate_treatment: adjust_acquisition_cost

cost_to_serve:
  per_order_cents: 1800
  per_line_cents: 150
  per_delivery_cents: 900
  special_handling_per_unit_cents: 0
  min_order_value_cents: 50000
  max_orders_per_month: 6.0

waterfall:
  allocation_basis_priority: [actual, weight, cube, handling_units, lines, extended_price]
  rounding: half_even
  allocation_method: largest_remainder

outliers:
  method: modified_robust_zscore
  zscore_threshold: 3.5
  min_peer_group_size: 30
  mad_zero_fallback_pct: 0.10

segmentation:
  commercial_tree:
    max_depth: 5
    min_leaf_lines: 500
    min_leaf_lines_pct: 0.005
    min_leaf_customers: 20
    min_leaf_items: 10
  margin_driver_tree:
    max_depth: 4
    min_leaf_lines: 500
    min_leaf_lines_pct: 0.005
    min_leaf_customers: 20
    min_leaf_items: 10
  bootstrap_resamples: 30
  abc_a_share: 0.80
  abc_b_share: 0.15

price_guidance:
  band_percentiles: [0.25, 0.50, 0.75]
  observation_unit: customer_item_month_median
  # Minimum pocket GROSS margin: (pocket revenue - product cost) / pocket revenue.
  min_pocket_gross_margin: "0.05"
  # Optional minimum CONTRIBUTION margin (subtracts cost-to-serve too). Unset
  # by default; when set, guidance reports both floors and which one binds.
  # min_contribution_margin: "0.02"
  min_band_observations: 10
  provisional_target_percentile: 0.50
  provisional_start_percentile: 0.75
  floor_rounding: ceiling

sensitivity:
  panel_period: month
  active_assortment_lookback_months: 6
  min_first_stage_f: 10.0
  robustness_max_spread: 0.20
  max_ci_width: 1.0
  overid_alpha: 0.05
  # Two-way clustering (month AND customer, Cameron-Gelbach-Miller): demand
  # shocks correlate across the items a customer buys in one month AND, when
  # demand is persistent, across months within a customer. Chosen by the
  # persistent-demand coverage study (Run 4, 24.5; recorded in
  # docs/validation.json): under AR(1) customer demand, month-only clustering
  # covers ~78% and supplier x month ~77%, while month x customer stays within
  # the 90-98% target - and on the iid well-identified world it matches
  # month-only coverage exactly, so nothing is given up.
  cluster_level: month_customer
  # Where the supplier cost instrument comes from (Run 4, 27.6):
  #   reference_table  a mapped supplier_cost_index table (default)
  #   receipts         built from purchase/receipt history (mix-corrected
  #                    within-supplier log cost deviations)
  #   external         a public series (e.g. BLS PPI) mapped to categories via
  #                    external_index_map, then to suppliers by modal category
  instrument_source: reference_table
  # Validation without planted truth (Run 4, 27.4): temporal backtest, placebo
  # tests and rolling-window stability in the report. Informational only.
  real_data_validation: true
  backtest_holdout_months: 6
  placebo_draws: 10
  stability_window_months: 12
  stability_step_months: 6
  instruments:
    - name: supplier_cost_shock
      column: supplier_cost_shock
      varies_at: "supplier_id:month"
      exclusion_rationale: >
        Supplier-specific input cost shocks shift the prices a distributor pays
        and therefore the prices it charges, but individual customers' demand
        for an item does not depend on the supplier's upstream costs except
        through the price they are charged. Valid unless customers observe and
        react to supplier conditions directly (e.g. anticipated shortages).
      # Plausible non-price paths to quantity and how each is addressed
      # (Run 6, 60.4). The causal gate reads the competitor_prices path.
      paths_to_quantity:
        - channel: availability
          treatment: >
            A cost shock can coincide with a shortage that limits what the
            distributor can ship. Zero rows exist only where the item was
            available (sold to anyone that month), so market-wide stockout
            months carry no zero rows; residual within-month rationing is not
            observable and remains a stated limitation.
        - channel: lead_times
          treatment: >
            Longer supplier lead times could suppress orders independently of
            price. Not observed in the data; month and item-role-by-month
            fixed effects absorb market-wide timing shifts, and the pair fixed
            effect absorbs stable supplier service differences. Unresolved
            within-month, pair-specific lead-time shocks remain a limitation.
        - channel: supplier_changes
          treatment: >
            A customer could switch suppliers in response to the shock rather
            than change total purchases. Estimation is per item, so switching
            appears as a quantity response to price, which is the estimand's
            own-item scope; cross-item substitution is modeled only within
            declared substitution groups.
        - channel: competitor_prices
          treatment: >
            Industry-wide input cost shocks also move competitor prices, so
            part of the measured response is to the market moving, not to a
            unilateral move. Addressed by the market price index control when
            a public index is mapped; without it the estimate understates
            unilateral own-price sensitivity and the causal gate caps the
            status (Phase 70).
        - channel: expectations
          treatment: >
            Customers who anticipate further increases may pre-buy. The month
            fixed effects absorb common anticipation; pair-specific hoarding
            is not observable and remains a stated limitation.
        - channel: substitution
          treatment: >
            Substitution to other items in the assortment is modeled only
            within declared substitution groups (cross-price module);
            elsewhere the estimand is the own-item response including any
            substitution away.
    - name: category_tariff_shock
      column: category_tariff_shock
      varies_at: "item_category:month"
      exclusion_rationale: >
        Tariff changes on an import category move landed cost for all items in
        the category. Customer-level demand shocks do not cause tariff policy,
        and tariffs affect purchase quantity only through the realized price.
        Valid unless demand and tariff policy share a driver (e.g. a boom in a
        sector that also triggers protection).
      paths_to_quantity:
        - channel: availability
          treatment: >
            A tariff can reroute or delay imports for the whole category. The
            availability proxy (item sold to anyone that month) removes
            market-wide outage months from the zero rows; partial category
            shortages are not observable and remain a stated limitation.
        - channel: lead_times
          treatment: >
            Customs changes can slow the whole category at once; month and
            item-role-by-month fixed effects absorb common timing shifts.
        - channel: supplier_changes
          treatment: >
            Distributors may re-source within the category; the instrument
            varies at category level, so re-sourcing inside the category does
            not move it, and the estimand is the own-item response.
        - channel: competitor_prices
          treatment: >
            A tariff raises every seller's landed cost in the category, so
            competitor prices move with the instrument by construction.
            Addressed by the market price index control when a public index is
            mapped; without it the causal gate caps the status (Phase 70).
        - channel: expectations
          treatment: >
            Announced tariffs invite pre-buying before the effective date.
            Month fixed effects absorb common anticipation; the effective-date
            semantics put the cost change in the correct month.
        - channel: substitution
          treatment: >
            Substitution toward untariffed categories is outside the own-item
            estimand; within-category substitution is modeled only inside
            declared substitution groups.

opportunity:
  baseline_window_months: 12
  exclude_contract_protected: true
  exclude_insufficient_data: true

tariff_scenarios:
  pass_through_levels: [0.0, 0.5, 1.0]
  exclude_contract_protected: true
  cost_pool: new_receipts

reporting:
  output_formats: [parquet, csv, html]
  show_evidence_status: true
  show_data_coverage: true
  # Books tie-out (Run 4, 27.3), used when a gl_totals table is mapped: a
  # month-measure fails when the engine-vs-GL difference exceeds BOTH bounds
  # (the cents floor keeps tiny months from failing on rounding pennies).
  tieout_tolerance_pct: 0.5
  tieout_tolerance_cents: 100

# Fiscal calendar (Run 5, Phase 36). Drives the engine's ANALYTIC periods:
# panel periods, peer-group quarters, the guidance observation unit, baseline
# windows, period counts and the books tie-out. Data-declared periods
# (settlements, landed cost months, FX months) always follow the source data.
# calendar: calendar_months (default) | 4-4-5 | 4-5-4 | 5-4-4 | custom
# Week calendars: the fiscal year is the 52/53 weeks ending on
# year_end_weekday nearest the last day of year_end_month; a 53rd week extends
# the year's final period. calendar: custom needs a fiscal_periods reference
# table in the mapping (period_label, start_date, end_date, quarter_label).
fiscal:
  calendar: calendar_months
  year_end_month: 12
  year_end_weekday: saturday

# Pricing compliance (Run 5, Phase 37). Orientation, not legal advice; see
# docs/methodology.md, "Pricing-law considerations".
compliance:
  robinson_patman:
    enabled: true
    # Customers are treated as likely competitors when these customer
    # attributes match; recommended prices for the same item more than the
    # threshold apart (relative %, strictly greater) get a review flag with
    # the cost-to-serve difference attached as supporting documentation.
    competitor_attributes: [industry, region]
    price_difference_threshold_pct: 5.0
  # The market/competitor price index control is accepted only when the
  # mapping declares public_source: true for it (antitrust: competitors
  # sharing non-public prices through algorithms).
  market_index_public_source_required: true

# Action generation (Run 5, Phase 38). Dates anchor to the data's last invoice
# date, so a given world always generates identical actions.
actions:
  enabled: true
  default_owner: unassigned
  priority:
    high_impact_cents: 500000      # >= $5,000 expected impact
    medium_impact_cents: 50000     # >= $500
    demote_without_causal: true    # non-causal volume evidence drops one level
  due_days_high: 14
  due_days_medium: 30
  due_days_low: 60
  pass_through_level: 0.5          # never assume full pass-through
  max_pass_through_scenarios: 2
  leakage_review_min_ratio: 1.5    # customer rate vs segment median
  leakage_review_min_excess_cents: 100000
  max_actions_per_type: 200

# Drift monitoring (Run 5, Phase 43). Each live-mode refresh compares against
# the previous run; only moves beyond these thresholds are flagged.
drift:
  enabled: true
  ari_warn_below: 0.8            # segment-assignment agreement (adjusted Rand)
  min_common_lines: 100
  elasticity_abs_change: 0.3     # absolute move of a segment's IV estimate
  data_quality_change_pp: 2.0    # data-quality rate change, percentage points
  status_share_change: 0.2       # guidance status count: relative change...
  min_status_count_change: 5     # ...AND at least this many pairs
