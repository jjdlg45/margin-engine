# Mapping for the synthetic ERP export (synth/). Declares column names AND
# business meaning. The engine refuses to compute anything whose semantics are
# not declared here.

source_system: synth_erp
lines_file: invoice_lines.csv
decimal_separator: "."

lines:
  source_line_key: {column: LINE_KEY}
  invoice_id: {column: INV_NO}
  invoice_date: {column: INV_DT, format: "%m/%d/%Y"}
  order_id: {column: ORD_NO}
  customer_id: {column: CUST_NO}
  item_id: {column: ITEM_NO}
  quantity: {column: QTY_SHP}
  uom: {column: SELL_UOM}
  net_amount:
    column: EXT_NET
    currency: line_currency
    sign_convention: natural
    discounts_embedded: true
  unit_price:
    column: UNIT_PRC
    currency: line_currency
    authoritative: false   # EXT_NET is authoritative; UNIT_PRC is informational
  list_price:
    column: LIST_PRC
    currency: line_currency
  on_invoice_discount:
    column: DISC_AMT
    currency: line_currency
    sign_convention: positive_reduces_revenue
  unit_cost:
    column: UNIT_CST
    currency: USD
    cost_basis: average
    includes_inbound_freight: false
    includes_duty: false
    includes_vendor_rebates: false
    per_uom: base_uom
    missing_as: blank
  transaction_type:
    column: TXN_CD
    code_map: {S: sale, R: return, C: credit, F: free_good}
    reversal_handling: own_code
  credit_reason: {column: REASON_CD}
  original_invoice_ref: {column: ORIG_INV}
  sales_rep_id: {column: REP_ID}
  channel: {column: CHNL}
  customer_rebate_amount:
    column: REB_AMT
    currency: line_currency
    sign_convention: positive_reduces_revenue
  rebate_program_id: {column: REB_PGM}
  freight_concession:
    column: FRT_CONC
    currency: line_currency
    sign_convention: positive_reduces_revenue
  contract_id: {column: CONTRACT_NO}
  kit_parent_id: {column: KIT_ID}
  currency: {column: CURR}
  restocking_fee:
    column: RESTOCK_FEE
    currency: line_currency
    sign_convention: natural
  return_freight_billed:
    column: RTN_FRT_BILLED
    currency: line_currency
    sign_convention: natural

return_reason_map:
  CUST_ERR: customer_error
  DIST_ERR: distributor_error
  DEFECT: defective

credit_reason_map:
  price_correction: price_correction
  damage: damage
  shortage: shortage
  quality: quality

reference_tables:
  price_list:
    file: price_list.csv
    date_format: "%m/%d/%Y"
    columns: {item_id: ITEM_NO, effective_date: EFF_DT, list_price: LIST_PRC}
  uom_conversions:
    file: uom_conversions.csv
    columns: {item_id: ITEM_NO, from_uom: FROM_UOM, to_uom: TO_UOM, factor: FACTOR}
  customers:
    file: customers.csv
    columns:
      customer_id: CUST_NO
      customer_name: CUST_NAME
      industry: INDUSTRY
      region: REGION
      size_band: SIZE_BAND
      channel: CHNL
      contract_type: CONTRACT_TYPE
      bill_to_id: BILL_TO
      parent_account_id: PARENT_ACCT
      sales_rep_id: REP_ID
  items:
    file: items.csv
    columns:
      item_id: ITEM_NO
      item_description: ITEM_DESC
      item_family: FAMILY
      item_category: CATEGORY
      category_name: CAT_NAME
      supplier_id: SUPPLIER
      supplier_name: SUPP_NAME
      item_role: ITEM_ROLE
      is_service: SVC_FLAG
      base_uom: BASE_UOM
      weight: WEIGHT_LB
      cube: CUBE_FT
  contracts:
    file: contracts.csv
    date_format: "%m/%d/%Y"
    columns:
      contract_id: CONTRACT_NO
      customer_id: CUST_NO
      item_family: FAMILY
      start_date: START_DT
      end_date: END_DT
      discount_pct: DISC_PCT
      price_protected: PROTECTED
  rebate_programs:
    file: rebate_programs.csv
    columns:
      rebate_program_id: PGM_ID
      customer_id: CUST_NO
      program_kind: KIND
      rate_pct: RATE_PCT
  rebate_settlements:
    file: rebate_settlements.csv
    columns:
      customer_id: CUST_NO
      period: PERIOD
      rebate_program_id: PGM_ID
      amount: AMT
  order_charges:
    file: order_charges.csv
    columns: {order_id: ORD_NO, charge_code: CHG_CD, amount: AMT}
  freight_log:
    file: freight_log.csv
    columns: {order_id: ORD_NO, amount: FRT_EXP_AMT}
  vendor_rebate_programs:
    file: vendor_rebate_programs.csv
    columns: {supplier_id: SUPPLIER, rate_pct: RATE_PCT}
  landed_cost_components:
    file: landed_cost_components.csv
    columns:
      item_id: ITEM_NO
      period: PERIOD
      inbound_freight_per_unit: INB_FRT_PU
      duty_per_unit: DUTY_PU
  supplier_cost_index:
    file: supplier_cost_index.csv
    columns: {supplier_id: SUPPLIER, period: PERIOD, cost_idx: COST_IDX}
  tariff_schedule:
    file: tariff_schedule.csv
    columns: {item_category: CATEGORY, period: PERIOD, duty_pct: DUTY_PCT}
  return_freight_log:
    file: return_freight_log.csv
    columns: {invoice_id: RET_INV_NO, amount: RTN_FRT_EXP}
  fx_rates:
    file: fx_rates.csv
    columns: {currency: CURR, period: PERIOD, rate: USD_PER_UNIT}
  rebate_program_tiers:
    file: rebate_program_tiers.csv
    columns: {rebate_program_id: PGM_ID, min_amount: MIN_AMT, rate_pct: RATE_PCT}
  tiered_settlements:
    file: tiered_settlements.csv
    columns: {customer_id: CUST_NO, period: PERIOD, rebate_program_id: PGM_ID, amount: AMT}
  inventory_receipts:
    file: receipts.csv
    date_format: "%Y-%m-%d"
    columns: {item_id: ITEM_NO, receipt_date: RCPT_DT, quantity: RCPT_QTY, unit_cost: UNIT_CST}
  quotes:
    file: quotes.csv
    date_format: "%m/%d/%Y"
    columns:
      quote_date: QUOTE_DT
      customer_id: CUST_NO
      item_id: ITEM_NO
      quantity: QTY
      quoted_price: QUOTE_PRC
      close_price: CLOSE_PRC
      outcome: OUTCOME
  substitution_groups:
    file: substitution_groups.csv
    columns: {group_id: GROUP_ID, item_id: ITEM_NO}
